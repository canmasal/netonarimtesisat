<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Net Onarım Tesisat</title>
  <meta name="description" content="Net Onarım Tesisat – web sitemiz çok yakında yayında.">
  <style>
    :root { --bg: #f5f7fa; --fg: #1d2733; --muted: #5b6878; --accent: #1565c0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161c; --fg: #e8edf2; --muted: #9aa7b5; --accent: #64a8f0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.125rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Net Onarım <span>Tesisat</span></h1>
    <p>Web sitemiz çok yakında yayında.</p>
  </main>
</body>
</html>
